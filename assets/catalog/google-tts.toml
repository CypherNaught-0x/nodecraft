# Cloud Text-to-Speech on Google Cloud (#21), checked 2026-10-23:
# https://cloud.google.com/text-to-speech/pricing
# https://docs.cloud.google.com/text-to-speech/docs/list-voices-and-types
# https://docs.cloud.google.com/text-to-speech/docs/chirp3-hd
# https://docs.cloud.google.com/text-to-speech/docs/gemini-tts
# Signed in with a service account's key file (keychain account "google-cloud"), billed to the
# account's own project. Every output is MP3.
# The classic families are priced per character sent, SSML tags included, so their price is known
# only once the text is; each family is its own model because each has its own price, and the
# adapter refuses a voice from another family. Free monthly tiers aren't counted.
# Gemini-TTS bills text tokens in and audio tokens out, and the reply reports neither, so it is
# priced by usage.

[[model]]
id="google-tts.chirp3-hd"
provider="google-tts"
provider_model="chirp3-hd"
label="Google TTS Chirp 3: HD"
description="Google's most natural classic voices, in 30 personas across many languages. Takes text or SSML. Priced per 1000 characters."
latency_s=3
quality=5
pricing={type="per_unit",unit="thousand_characters",price="0.03 USD"}

[[model.modes]]
id="text-to-speech"
output="audio"
inputs=[{role="prompt",modality="text",min=1,max=1,inline=true}]

[[model.params.params]]
name="voice"
label="Voice"
control={type="choice",options=[{value="en-US-Chirp3-HD-Achernar",label="Achernar"},{value="en-US-Chirp3-HD-Achird",label="Achird"},{value="en-US-Chirp3-HD-Algenib",label="Algenib"},{value="en-US-Chirp3-HD-Algieba",label="Algieba"},{value="en-US-Chirp3-HD-Alnilam",label="Alnilam"},{value="en-US-Chirp3-HD-Aoede",label="Aoede"},{value="en-US-Chirp3-HD-Autonoe",label="Autonoe"},{value="en-US-Chirp3-HD-Callirrhoe",label="Callirrhoe"},{value="en-US-Chirp3-HD-Charon",label="Charon"},{value="en-US-Chirp3-HD-Despina",label="Despina"},{value="en-US-Chirp3-HD-Enceladus",label="Enceladus"},{value="en-US-Chirp3-HD-Erinome",label="Erinome"},{value="en-US-Chirp3-HD-Fenrir",label="Fenrir"},{value="en-US-Chirp3-HD-Gacrux",label="Gacrux"},{value="en-US-Chirp3-HD-Iapetus",label="Iapetus"},{value="en-US-Chirp3-HD-Kore",label="Kore"},{value="en-US-Chirp3-HD-Laomedeia",label="Laomedeia"},{value="en-US-Chirp3-HD-Leda",label="Leda"},{value="en-US-Chirp3-HD-Orus",label="Orus"},{value="en-US-Chirp3-HD-Pulcherrima",label="Pulcherrima"},{value="en-US-Chirp3-HD-Puck",label="Puck"},{value="en-US-Chirp3-HD-Rasalgethi",label="Rasalgethi"},{value="en-US-Chirp3-HD-Sadachbia",label="Sadachbia"},{value="en-US-Chirp3-HD-Sadaltager",label="Sadaltager"},{value="en-US-Chirp3-HD-Schedar",label="Schedar"},{value="en-US-Chirp3-HD-Sulafat",label="Sulafat"},{value="en-US-Chirp3-HD-Umbriel",label="Umbriel"},{value="en-US-Chirp3-HD-Vindemiatrix",label="Vindemiatrix"},{value="en-US-Chirp3-HD-Zephyr",label="Zephyr"},{value="en-US-Chirp3-HD-Zubenelgenubi",label="Zubenelgenubi"}]}
default={type="text",value="en-US-Chirp3-HD-Kore"}

[[model.params.params]]
name="voice_name"
label="Voice name, any language (overrides Voice)"
control={type="text",multiline=false,max_bytes=64}

[[model.params.params]]
name="input_format"
label="Input"
control={type="choice",options=[{value="text",label="Text"},{value="ssml",label="SSML"}]}
default={type="text",value="text"}

[[model.params.params]]
name="speaking_rate"
label="Speed"
control={type="slider",min=0.25,max=2.0,step=0.05}
default={type="number",value=1.0}

