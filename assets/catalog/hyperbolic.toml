# GLM 5.3 Flash (Hyperbolic) through rig-core 0.46's own dialect (#1152).
# Checked 2026-11-09: https://www.hyperbolic.ai/docs/inference/quickstart documents
# glm-5.3-flash at https://api.hyperbolic.ai/inference/v1. The previous xyz API was
# decommissioned. No verified fixed inference rate: unknown usage pricing requires admission.
# Latency and selection tier below are generic discovery hints, not measurements.
[[model]]
id = "hyperbolic.glm-5.3-flash"
provider = "hyperbolic"
provider_model = "glm-5.3-flash"
label = "GLM 5.3 Flash (Hyperbolic)"
description = "Text chat. Price is unknown here; check your provider account before running."
latency_s = 20
quality = 2
pricing = { type = "by_usage", currency = "USD" }

[[model.modes]]
id = "text-to-text"
output = "text"
inputs = [{ role = "prompt", modality = "text", min = 1, max = 1, inline = true }]

[[model.params.params]]
name = "max_tokens"
label = "Max output tokens"
description = "Requested completion limit. Your model may require a smaller limit; reasoning may count separately."
control = { type = "unsigned", min = "1", max = "8192" }
default = { type = "unsigned", value = "1024" }
