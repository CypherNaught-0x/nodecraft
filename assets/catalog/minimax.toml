# Current MiniMax models via the existing fal key and queue; checked2026-10-28.
# Schemas: https://fal.ai/models/minimax/h3/text-to-video/api
# https://fal.ai/models/minimax/h3/image-to-video/api
# https://fal.ai/models/fal-ai/minimax/speech-2.8-hd/api
# https://fal.ai/models/minimax/music-3/api
# Rates from those model pages. Native streamed asset storage required before payment.

[[model]]
id="fal.minimax-h3"
provider="fal"
provider_model="minimax/h3/text-to-video"
label="MiniMax H3 text video (fal)"
description="Create one 5–15 second MP4 with native audio at an explicit 480P or 768P. Desktop streamed storage required. Prompt expansion is disabled."
latency_s=180
quality=4
pricing={type="per_unit_by_choice",unit="second",count="duration",param="resolution",prices={"480P"="0.05 USD","768P"="0.06 USD"}}
[[model.modes]]
id="text-to-video"
output="video"
inputs=[{role="prompt",modality="text",min=1,max=1,inline=true}]
[[model.params.params]]
name="duration"
label="Duration (seconds)"
control={type="unsigned",min="5",max="15",step="1"}
default={type="unsigned",value="5"}
[[model.params.params]]
name="resolution"
label="Resolution"
control={type="choice",options=[{value="480P",label="480P"},{value="768P",label="768P"}]}
default={type="text",value="480P"}
[[model.params.params]]
name="aspect_ratio"
label="Aspect ratio"
control={type="choice",options=[{value="21:9",label="21:9"},{value="16:9",label="16:9"},{value="4:3",label="4:3"},{value="1:1",label="1:1"},{value="3:4",label="3:4"},{value="9:16",label="9:16"}]}
default={type="text",value="16:9"}
[[model.params.params]]
name="seed"
label="Fixed seed (optional, local u32 range)"
control={type="unsigned",min="0",max="4294967295",step="1"}

[[model]]
id="fal.minimax-h3-i2v"
provider="fal"
provider_model="minimax/h3/image-to-video"
label="MiniMax H3 first-frame video (fal)"
description="Create one 5–15 second MP4 with native audio at an explicit 480P or 768P. Desktop streamed storage required. One upright 32–1024 px frame, 1 MiB, aspect 1:3–3:1."
latency_s=180
quality=4
pricing={type="per_unit_by_choice",unit="second",count="duration",param="resolution",prices={"480P"="0.05 USD","768P"="0.06 USD"}}
[[model.modes]]
id="image-to-video"
output="video"
inputs=[{role="prompt",modality="text",min=1,max=1,inline=true},{role="first_frame",modality="image",min=1,max=1}]
[[model.params.params]]
name="duration"
label="Duration (seconds)"
control={type="unsigned",min="5",max="15",step="1"}
default={type="unsigned",value="5"}
[[model.params.params]]
name="resolution"
label="Resolution"
control={type="choice",options=[{value="480P",label="480P"},{value="768P",label="768P"}]}
default={type="text",value="480P"}
[[model.params.params]]
name="seed"
label="Fixed seed (optional, local u32 range)"
control={type="unsigned",min="0",max="4294967295",step="1"}

[[model]]
id="fal.minimax-speech28-hd"
provider="fal"
provider_model="fal-ai/minimax/speech-2.8-hd"
label="MiniMax Speech 2.8 HD (fal)"
description="Plain speech from up to 4096 UTF-8 bytes, using a stock voice. Fixed mono 32 kHz MP3. Quote conservatively counts UTF-8 bytes at $0.10 per 1000 characters; desktop storage required. Long-pause markup is refused."
latency_s=30
quality=4
pricing={type="per_unit",unit="thousand_characters",price="0.10 USD"}
[[model.modes]]
id="text-to-speech"
output="audio"
inputs=[{role="prompt",modality="text",min=1,max=1,inline=true}]
[[model.params.params]]
name="voice"
label="Voice"
control={type="choice",options=[{value="Wise_Woman",label="Wise Woman"},{value="Friendly_Person",label="Friendly Person"},{value="Deep_Voice_Man",label="Deep Voice Man"},{value="Calm_Woman",label="Calm Woman"}]}
default={type="text",value="Wise_Woman"}
[[model.params.params]]
name="speed"
label="Speech speed"
control={type="slider",min=0.5,max=2.0,step=0.05}
default={type="number",value=1.0}
[[model.params.params]]
name="pitch"
label="Voice pitch"
control={type="integer",min="-12",max="12",step="1"}
default={type="integer",value="0"}

[[model]]
id="fal.minimax-music3"
provider="fal"
provider_model="minimax/music-3"
label="MiniMax Music 3 (fal)"
description="Create one song up to the chosen 1–300 second bound from a music description and editable lyrics. Tags go on separate lines. Fixed 44.1 kHz 16-bit stereo WAV; desktop streamed storage required."
latency_s=120
quality=4
pricing={type="per_unit",unit="second",price="0.002 USD",count="duration"}
[[model.modes]]
id="text-to-audio"
output="audio"
inputs=[{role="prompt",modality="text",min=1,max=1,inline=true}]
[[model.params.params]]
name="duration"
label="Maximum duration (seconds)"
control={type="unsigned",min="1",max="300",step="1"}
default={type="unsigned",value="60"}
[[model.params.params]]
name="lyrics"
label="Lyrics (tags on separate lines)"
control={type="text",multiline=true,max_bytes=16384}
default={type="text",value="[instrumental]"}
[[model.params.params]]
name="seed"
label="Fixed seed (optional, local u32 range)"
control={type="unsigned",min="0",max="4294967295",step="1"}
