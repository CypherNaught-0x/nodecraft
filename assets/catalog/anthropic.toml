# Claude Haiku 5.5 is priced by prompt length: up to 100,000 prompt tokens 0.10 / 0.50 USD per MTok
# (input / output), over that 0.50 / 2.50. The quote uses the higher output rate so it stays an
# upper bound for the reply whatever the prompt length (verified 2026-10-21).
[[model]]
id = "anthropic.claude-haiku-5-5"
provider = "anthropic"
provider_model = "claude-haiku-5-5"
label = "Claude Haiku 5.5"
description = "Fast text reasoning for high-volume extraction, classification and short tasks. Token pricing."
# Rough latency hint for a short reply, not measured locally.
