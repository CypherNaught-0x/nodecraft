# Official OpenAI Images API/guide verified 2026-10-18.
# https://developers.openai.com/api/docs/guides/image-generation
# https://developers.openai.com/api/docs/pricing#image-generation
# Composite measured usage has NO numerical pre-submit quote. No price is implied by N.

[[model]]
id = "openai-images.sunburst"
provider = "openai-images"
provider_model = "gpt-image-2.5-sunburst-2026-09-08"
label = "GPT Image 2.5 Sunburst"
description = "Generate and edit images with ordered references and an optional first-image alpha mask. Price depends on measured usage."
# Documented guide upper latency hint, not a measured benchmark.
latency_s = 120
quality = 4
pricing = { type = "by_usage", currency = "USD" }

[[model.modes]]
id = "text-to-image"
output = "image"
inputs = [{ role = "prompt", modality = "text", min = 1, max = 1, inline = true }]

[[model.modes]]
id = "edit"
output = "image"
inputs = [
 { role = "prompt", modality = "text", min = 1, max = 1, inline = true },
 { role = "image", modality = "image", min = 1, max = 16 },
]

[[model.modes]]
id = "inpaint"
output = "image"
inputs = [
 { role = "prompt", modality = "text", min = 1, max = 1, inline = true },
 { role = "image", modality = "image", min = 1, max = 16 },
 { role = "mask", modality = "image", min = 1, max = 1 },
]

[[model.params.params]]
name = "size"
label = "Size"
control = { type = "choice", options = [{ value = "1024x1024", label = "1024x1024" }, { value = "1536x1024", label = "1536x1024" }, { value = "1024x1536", label = "1024x1536" }, { value = "auto", label = "auto" }] }
default = { type = "text", value = "1024x1024" }

[[model.params.params]]
name = "quality"
label = "Quality"
control = { type = "choice", options = [{ value = "low", label = "low" }, { value = "medium", label = "medium" }, { value = "high", label = "high" }, { value = "xhigh", label = "xhigh" }, { value = "max", label = "max" }, { value = "auto", label = "auto" }] }
default = { type = "text", value = "auto" }

[[model.params.params]]
name = "background"
label = "Background"
control = { type = "choice", options = [{ value = "opaque", label = "opaque" }, { value = "transparent", label = "transparent" }, { value = "auto", label = "auto" }] }
default = { type = "text", value = "auto" }

[[model.params.params]]
name = "output_format"
label = "Output format"
control = { type = "choice", options = [{ value = "png", label = "png" }, { value = "jpeg", label = "jpeg" }, { value = "webp", label = "webp" }] }
default = { type = "text", value = "png" }

[[model.params.params]]
name = "n"
label = "Images"
control = { type = "unsigned", min = "1", max = "10" }
default = { type = "unsigned", value = "1" }

[[model.params.params]]
name = "output_compression"
label = "Compression (JPEG/WebP)"
control = { type = "unsigned", min = "0", max = "100" }

# Only n has a verified cross-model meaning. Other names carry no compatibility claim.
# OpenAI create-image API, checked 2026-10-19: n counts 1..10 generated images.
# https://developers.openai.com/api/reference/resources/images/methods/generate
[model.parameter_contract]
version = { major = 1, minor = 0 }
namespace = "openai-images.sunburst"
owner = "model"

[[model.parameter_contract.rules]]
param = "n"
unit = "count"
meaning = "generated_image_count"

[[model.parameter_contract.schema.params]]
name = "size"
label = "Size"
control = { type = "choice", options = [{ value = "1024x1024", label = "1024x1024" }, { value = "1536x1024", label = "1536x1024" }, { value = "1024x1536", label = "1024x1536" }, { value = "auto", label = "auto" }] }
default = { type = "text", value = "1024x1024" }

[[model.parameter_contract.schema.params]]
name = "quality"
label = "Quality"
control = { type = "choice", options = [{ value = "low", label = "low" }, { value = "medium", label = "medium" }, { value = "high", label = "high" }, { value = "xhigh", label = "xhigh" }, { value = "max", label = "max" }, { value = "auto", label = "auto" }] }
default = { type = "text", value = "auto" }

[[model.parameter_contract.schema.params]]
name = "background"
label = "Background"
control = { type = "choice", options = [{ value = "opaque", label = "opaque" }, { value = "transparent", label = "transparent" }, { value = "auto", label = "auto" }] }
default = { type = "text", value = "auto" }

[[model.parameter_contract.schema.params]]
name = "output_format"
label = "Output format"
control = { type = "choice", options = [{ value = "png", label = "png" }, { value = "jpeg", label = "jpeg" }, { value = "webp", label = "webp" }] }
default = { type = "text", value = "png" }

[[model.parameter_contract.schema.params]]
name = "n"
label = "Images"
control = { type = "unsigned", min = "1", max = "10" }
default = { type = "unsigned", value = "1" }

[[model.parameter_contract.schema.params]]
name = "output_compression"
label = "Compression (JPEG/WebP)"
control = { type = "unsigned", min = "0", max = "100" }

