# Command A (Cohere) through rig-core 0.46's own dialect (#1152).
# Checked 2026-11-09: https://cohere.com/pricing lists Model Vault GPU pricing,
# not a Command A per-token API table. No API rate is inferred from GPU prices.
# Unknown usage pricing requires explicit admission.
# Latency and selection tier below are generic discovery hints, not measurements.
[[model]]
id = "cohere.command-a"
provider = "cohere"
provider_model = "command-a-03-2025"
label = "Command A (Cohere)"
description = "Text chat. Price is unknown here; check your provider account before running."
latency_s = 20
quality = 2
pricing = { type = "by_usage", currency = "USD" }

[[model.modes]]
id = "text-to-text"
output = "text"
inputs = [{ role = "prompt", modality = "text", min = 1, max = 1, inline = true }]

[[model.params.params]]
name = "max_tokens"
label = "Max output tokens"
description = "Requested completion limit. Your model may require a smaller limit; reasoning may count separately."
control = { type = "unsigned", min = "1", max = "8000" }
default = { type = "unsigned", value = "1024" }
