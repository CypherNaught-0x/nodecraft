# ElevenLabs official API and pricing checked 2026-10-21.
# https://elevenlabs.io/pricing/api
# https://elevenlabs.io/docs/api-reference/text-to-speech/convert
# https://elevenlabs.io/docs/api-reference/text-to-sound-effects/convert
# https://elevenlabs.io/docs/api-reference/music/compose
# https://elevenlabs.io/docs/api-reference/speech-to-speech/convert
# Speech is priced per 1000 characters sent, so its price is known only once the prompt is.
# Sound effects are 0.12 USD per minute of generated sound (0.002 USD per second), so the
# quote follows the chosen duration.
# Every output is MP3 at 44.1 kHz, 128 kbps.

[[model]]
id="elevenlabs.v3"
provider="elevenlabs"
provider_model="eleven_v3"
label="Eleven v3"
description="Expressive speech in 70+ languages, up to 5000 characters. Priced per 1000 characters."
latency_s=10
quality=5
pricing={type="per_unit",unit="thousand_characters",price="0.08 USD"}

[[model.modes]]
id="text-to-speech"
output="audio"
inputs=[{role="prompt",modality="text",min=1,max=1,inline=true}]

[[model.params.params]]
name="voice"
label="Voice"
control={type="choice",options=[{value="EXAVITQu4vr4xnSDxMaL",label="Sarah"},{value="JBFqnCBsd6RMkjVDRZzb",label="George"},{value="XB0fDUnXU5powFXDhCwa",label="Charlotte"},{value="onwK4e9ZLuTAKqWW03F9",label="Daniel"},{value="Xb7hH8MSUJpSbSDYk0k2",label="Alice"},{value="nPczCjzI2devNBz1zQrb",label="Brian"},{value="pFZP5JQG7iQjIQuC4Bku",label="Lily"},{value="XrExE9yKIg1WjnnlVkGX",label="Matilda"},{value="TX3LPaxmHKxFdv7VOQHJ",label="Liam"},{value="cgSgspJ2msm6clMCkdW9",label="Jessica"}]}
default={type="text",value="EXAVITQu4vr4xnSDxMaL"}

[[model.params.params]]
name="voice_id"
label="Voice id (overrides Voice)"
control={type="text",multiline=false,max_bytes=64}

[[model.params.params]]
name="stability"
label="Stability"
# Eleven v3 takes only 0 (creative), 0.5 (natural) and 1 (robust).
control={type="slider",min=0.0,max=1.0,step=0.5}
default={type="number",value=0.5}

[[model.params.params]]
name="similarity_boost"
label="Similarity"
control={type="slider",min=0.0,max=1.0,step=0.05}
default={type="number",value=0.75}

[[model.params.params]]
name="style"
label="Style"
control={type="slider",min=0.0,max=1.0,step=0.05}
default={type="number",value=0.0}

[[model.params.params]]
name="speed"
label="Speed"
control={type="slider",min=0.7,max=1.2,step=0.05}
default={type="number",value=1.0}

[[model.params.params]]
name="language_code"
label="Language (ISO 639-1, optional)"
control={type="text",multiline=false,max_bytes=8}

[[model.params.params]]
name="seed"
label="Seed (optional)"
control={type="unsigned",min="0",max="4294967295",step="1"}

