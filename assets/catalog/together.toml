# Llama 3.3 70B (Together AI) through rig-core 0.46's own dialect (#1152).
# Pricing reference: https://www.together.ai/pricing
# 2026-11-09: current vendor prices could not be verified in this environment. Unknown
# usage pricing requires explicit admission; no zero price or token rate is invented.
# Latency and selection tier below are generic discovery hints, not measurements.
[[model]]
id = "together.llama-3.3-70b"
provider = "together"
provider_model = "meta-llama/Llama-3.3-70B-Instruct-Turbo"
label = "Llama 3.3 70B (Together AI)"
description = "Text chat. Price is unknown here; check your provider account before running."
latency_s = 20
quality = 2
pricing = { type = "by_usage", currency = "USD" }

[[model.modes]]
id = "text-to-text"
output = "text"
inputs = [{ role = "prompt", modality = "text", min = 1, max = 1, inline = true }]

[[model.params.params]]
name = "max_tokens"
label = "Max output tokens"
description = "Requested completion limit. Your model may require a smaller limit; reasoning may count separately."
control = { type = "unsigned", min = "1", max = "8192" }
default = { type = "unsigned", value = "1024" }
