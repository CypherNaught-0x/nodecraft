# GPT OSS 120B (Together AI) through rig-core 0.46's own dialect (#1152).
# Checked 2026-11-09: https://www.together.ai/pricing and
# https://docs.together.ai/docs/serverless/models list GPT OSS 120B at $0.15 input /
# $0.60 output per 1M tokens. Reasoning makes an up-front bound uncertain.
# Latency and selection tier below are generic discovery hints, not measurements.
[[model]]
id = "together.gpt-oss-120b"
provider = "together"
provider_model = "openai/gpt-oss-120b"
label = "GPT OSS 120B (Together AI)"
description = "Text chat with usage pricing. No up-front quote; token rates apply after the reply."
latency_s = 20
quality = 2
pricing = { type = "by_usage", currency = "USD" }
usage = { input = "0.00015 USD", output = "0.0006 USD" }

[[model.modes]]
id = "text-to-text"
output = "text"
inputs = [{ role = "prompt", modality = "text", min = 1, max = 1, inline = true }]

[[model.params.params]]
name = "max_tokens"
label = "Max output tokens"
description = "Requested completion limit. Your model may require a smaller limit; reasoning may count separately."
control = { type = "unsigned", min = "1", max = "8192" }
default = { type = "unsigned", value = "1024" }
