label="Image size"
control={type="choice",options=[{value="square_hd",label="Square 1024"},{value="square",label="Square 512"},{value="portrait_4_3",label="Portrait 3:4"},{value="portrait_16_9",label="Portrait 9:16"},{value="landscape_4_3",label="Landscape 4:3"},{value="landscape_16_9",label="Landscape 16:9"}]}
default={type="text",value="square_hd"}

[[model.params.params]]
name="colors"
label="Preferred colors (up to six #RRGGBB, comma separated)"
control={type="text",multiline=false,max_bytes=47}
default={type="text",value=""}

[[model.params.params]]
