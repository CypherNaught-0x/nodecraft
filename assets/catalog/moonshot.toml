# Kimi K3 (Moonshot) through rig-core 0.46's own dialect (#1152).
# Checked 2026-11-09: https://platform.kimi.ai/docs/pricing/chat exposes cache-write
# pricing by TTL but its numeric K3 table was not available in the retrieved page.
# Unknown usage pricing requires explicit admission; no rate is guessed.
# Latency and selection tier below are generic discovery hints, not measurements.
[[model]]
id = "moonshot.kimi-k3"
provider = "moonshot"
provider_model = "kimi-k3"
label = "Kimi K3 (Moonshot)"
description = "Text chat. Price is unknown here; check your provider account before running."
latency_s = 20
quality = 2
pricing = { type = "by_usage", currency = "USD" }

[[model.modes]]
id = "text-to-text"
output = "text"
inputs = [{ role = "prompt", modality = "text", min = 1, max = 1, inline = true }]

[[model.params.params]]
name = "max_tokens"
label = "Max output tokens"
description = "Requested completion limit. Your model may require a smaller limit; reasoning may count separately."
control = { type = "unsigned", min = "1", max = "8192" }
default = { type = "unsigned", value = "1024" }
