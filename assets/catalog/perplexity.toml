# Sonar (Perplexity) through rig-core 0.46's own dialect (#1152).
# Checked 2026-11-09: https://docs.perplexity.ai/docs/agent-api/migrate-from-sonar/overview
# says synchronous and streamed Sonar requests are reformulated as Agent API requests.
# https://docs.perplexity.ai/docs/getting-started/pricing does not provide one stable
# all-in Sonar price here: unknown usage pricing requires explicit admission.
# Latency and selection tier below are generic discovery hints, not measurements.
[[model]]
id = "perplexity.sonar"
provider = "perplexity"
provider_model = "sonar"
label = "Sonar (Perplexity)"
description = "Text chat. Price is unknown here; check your provider account before running."
latency_s = 20
quality = 2
pricing = { type = "by_usage", currency = "USD" }

[[model.modes]]
id = "text-to-text"
output = "text"
inputs = [{ role = "prompt", modality = "text", min = 1, max = 1, inline = true }]

[[model.params.params]]
name = "max_tokens"
label = "Max output tokens"
description = "Requested completion limit. Your model may require a smaller limit; reasoning may count separately."
control = { type = "unsigned", min = "1", max = "8192" }
default = { type = "unsigned", value = "1024" }
