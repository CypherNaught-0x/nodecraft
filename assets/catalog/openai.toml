# OpenAI Chat Completions (`providers::llm`, OpenAI dialect), checked 2026-10-21.
# Models and limits: https://developers.openai.com/api/docs/models (each model's page)
# Prices: https://developers.openai.com/api/docs/pricing (Standard tier; verified 2026-10-21)
# The quote is the output-token price per 1000 tokens counted on `max_tokens`, sent as
# `max_completion_tokens`, which caps visible and reasoning tokens together: an upper bound on the
# reply. Input tokens are billed on top and are NOT in the quote.
# Reasoning models (GPT-6 family) reject temperature unless reasoning effort is `none`, and the
# adapter never sets an effort (their default is `medium`), so they offer no temperature.
# https://developers.openai.com/api/docs/guides/latest-model
# Image input (every model here lists "text, image" on its page):
# https://developers.openai.com/api/docs/guides/images-vision (checked 2026-10-21): PNG, JPEG,
# WebP, non-animated GIF.

# GPT-6.1 Sol: 2 USD / 1M input, 10 USD / 1M output; max output 128,000; Chat Completions
# supported without tools. https://developers.openai.com/api/docs/models/gpt-6.1-sol (verified 2026-10-21)
# A prompt over 272K input tokens bills the whole request at 1.5x (output 15 USD / 1M); the quote
# uses that rate so it stays an upper bound.
[[model]]
id = "openai.gpt-6.1-sol"
provider = "openai"
provider_model = "gpt-6.1-sol"
label = "GPT-6.1 Sol"
description = "OpenAI reasoning model. Quoted up to max output tokens at 15 USD per million output tokens (the rate for prompts over 272K tokens); input billed on top."
# Rough latency hint for a short reply, not measured locally.
latency_s = 20
quality = 4
pricing = { type = "per_unit", unit = "thousand_tokens", price = "0.015 USD", count = "max_tokens" }
# Charged at these per-1000-token rates once the reply reports its usage.
usage = { input = "0.002 USD", output = "0.01 USD", long = { above = 272000, input = "0.003 USD", output = "0.015 USD" } }

[[model.modes]]
id = "text-to-text"
output = "text"
inputs = [{ role = "prompt", modality = "text", min = 1, max = 1, inline = true }]

# Reads up to 16 images (PNG, JPEG, GIF, WebP) with the prompt: the adapter's MAX_IMAGES cap, under
# both APIs' per-request limits. Images are billed as input tokens, on top of the quote.
[[model.modes]]
id = "image-to-text"
output = "text"
inputs = [{ role = "prompt", modality = "text", min = 1, max = 1, inline = true }, { role = "image", modality = "image", min = 1, max = 16 }]

[[model.params.params]]
name = "max_tokens"
label = "Max output tokens"
description = "Upper limit on the reply, reasoning tokens included (sent as max_completion_tokens). The reply stops when it is reached."
control = { type = "unsigned", min = "1", max = "128000" }
default = { type = "unsigned", value = "16000" }

[model.parameter_contract]
version = { major = 1, minor = 0 }
namespace = "openai.gpt-6.1-sol"
owner = "model"

[[model.parameter_contract.rules]]
param = "max_tokens"
unit = "tokens"
meaning = "max_output_tokens"
affects = { cost = true }

[[model.parameter_contract.schema.params]]
name = "max_tokens"
label = "Max output tokens"
description = "Upper limit on the reply, reasoning tokens included (sent as max_completion_tokens). The reply stops when it is reached."
control = { type = "unsigned", min = "1", max = "128000" }
default = { type = "unsigned", value = "16000" }

