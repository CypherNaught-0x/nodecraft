# Original core-node Hunyuan3D shape presets; no third-party workflow files.
# Settings are a projected starting recipe pending live validation; docs/comfyui-3d.md.

[[model]]
id = "comfyui.hunyuan3d-2"
provider = "comfyui"
provider_model = "hunyuan3d-2.0"
label = "Hunyuan3D 2.0 (local)"
description = "Convert one image to an untextured GLB on your ComfyUI server. Requires the Hunyuan3D 2.0 checkpoint. Speed and hosting costs depend on your server."
latency_s = 120
quality = 4
pricing = { type = "free" }

[[model.modes]]
id = "image-to-3d"
output = "mesh"
inputs = [{ role = "image", modality = "image", min = 1, max = 1 }]

[[model.params.params]]
name = "checkpoint"
label = "Checkpoint"
control = { type = "text", multiline = false, max_bytes = 512 }
default = { type = "text", value = "hunyuan3d-dit-v2.safetensors" }

[[model.params.params]]
name = "steps"
label = "Steps"
control = { type = "unsigned", min = "1", max = "100" }
default = { type = "unsigned", value = "30" }

[[model.params.params]]
name = "cfg"
label = "Guidance"
control = { type = "slider", min = 1.0, max = 20.0, step = 0.5 }
default = { type = "number", value = 5.0 }

[[model.params.params]]
name = "seed"
label = "Seed"
control = { type = "seed" }

[model.parameter_contract]
version = { major = 1, minor = 0 }
namespace = "comfyui.hunyuan3d-2"
owner = "model"

[[model.parameter_contract.rules]]
param = "checkpoint"
options = { id = "comfyui.image_checkpoints" }

[[model.parameter_contract.schema.params]]
name = "checkpoint"
label = "Checkpoint"
control = { type = "text", multiline = false, max_bytes = 512 }
default = { type = "text", value = "hunyuan3d-dit-v2.safetensors" }

[[model.parameter_contract.schema.params]]
name = "steps"
label = "Steps"
control = { type = "unsigned", min = "1", max = "100" }
default = { type = "unsigned", value = "30" }

[[model.parameter_contract.schema.params]]
name = "cfg"
label = "Guidance"
control = { type = "slider", min = 1.0, max = 20.0, step = 0.5 }
default = { type = "number", value = 5.0 }

[[model.parameter_contract.schema.params]]
name = "seed"
label = "Seed"
control = { type = "seed" }


