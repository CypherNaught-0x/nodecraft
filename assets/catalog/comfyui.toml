# Models run by a local or remote ComfyUI server. They are free: they use your own GPU.
# Format: docs/catalog.md. Check with `cargo xtask catalog-check`.
# `provider_model` names the built-in workflow the ComfyUI adapter (#9) runs: core ComfyUI nodes
# only, with the checkpoint chosen on the card (`crates/providers/src/comfyui/template.rs`).

[[model]]
id = "comfyui.flux-dev"
provider = "comfyui"
provider_model = "flux-dev"
label = "FLUX.1 [dev] (local)"
description = "High-quality text-to-image and image-to-image on your own ComfyUI server."
latency_s = 40
quality = 4
pricing = { type = "free" }

[[model.modes]]
id = "text-to-image"
output = "image"
inputs = [{ role = "prompt", modality = "text", min = 1, max = 1, inline = true }]

[[model.modes]]
id = "image-to-image"
output = "image"
inputs = [
  { role = "prompt", modality = "text", min = 1, max = 1, inline = true },
  { role = "image", modality = "image", min = 1, max = 1 },
]

[[model.params.params]]
name = "checkpoint"
label = "Checkpoint"
description = "The FLUX checkpoint file on the server (an all-in-one fp8 file); Refresh option lists fetches what it has."
control = { type = "text", multiline = false, max_bytes = 512 }
default = { type = "text", value = "flux1-dev-fp8.safetensors" }

[[model.params.params]]
name = "aspect_ratio"
label = "Aspect ratio"
control = { type = "choice", options = [
  { value = "1:1", label = "Square 1:1" },
  { value = "4:3", label = "Landscape 4:3" },
  { value = "16:9", label = "Wide 16:9" },
  { value = "3:4", label = "Portrait 3:4" },
  { value = "9:16", label = "Tall 9:16" },
] }
default = { type = "text", value = "1:1" }

[[model.params.params]]
name = "steps"
label = "Steps"
control = { type = "unsigned", min = "1", max = "100" }
default = { type = "unsigned", value = "28" }

[[model.params.params]]
name = "seed"
label = "Seed"
control = { type = "seed" }

# The checkpoint comes from the server's installed list (#529).
[model.parameter_contract]
version = { major = 1, minor = 0 }
namespace = "comfyui.flux-dev"
owner = "model"

[[model.parameter_contract.rules]]
param = "checkpoint"
options = { id = "comfyui.checkpoints" }

[[model.parameter_contract.schema.params]]
name = "checkpoint"
label = "Checkpoint"
description = "The FLUX checkpoint file on the server (an all-in-one fp8 file); Refresh option lists fetches what it has."
control = { type = "text", multiline = false, max_bytes = 512 }
default = { type = "text", value = "flux1-dev-fp8.safetensors" }

[[model.parameter_contract.schema.params]]
name = "aspect_ratio"
label = "Aspect ratio"
control = { type = "choice", options = [
  { value = "1:1", label = "Square 1:1" },
  { value = "4:3", label = "Landscape 4:3" },
  { value = "16:9", label = "Wide 16:9" },
  { value = "3:4", label = "Portrait 3:4" },
  { value = "9:16", label = "Tall 9:16" },
] }
default = { type = "text", value = "1:1" }

[[model.parameter_contract.schema.params]]
name = "steps"
label = "Steps"
control = { type = "unsigned", min = "1", max = "100" }
default = { type = "unsigned", value = "28" }

[[model.parameter_contract.schema.params]]
name = "seed"
label = "Seed"
control = { type = "seed" }

[[model]]
id = "comfyui.sdxl"
provider = "comfyui"
provider_model = "sdxl-base"
label = "SDXL (local)"
description = "Fast general-purpose text-to-image on your own ComfyUI server."
latency_s = 12
quality = 3
pricing = { type = "free" }

[[model.modes]]
id = "text-to-image"
output = "image"
inputs = [{ role = "prompt", modality = "text", min = 1, max = 1, inline = true }]

[[model.params.params]]
name = "checkpoint"
label = "Checkpoint"
description = "The checkpoint file on the server; Refresh option lists fetches what it has."
control = { type = "text", multiline = false, max_bytes = 512 }
default = { type = "text", value = "sd_xl_base_1.0.safetensors" }

[[model.params.params]]
name = "steps"
label = "Steps"
control = { type = "unsigned", min = "1", max = "80" }
default = { type = "unsigned", value = "30" }

[[model.params.params]]
name = "cfg"
label = "Guidance"
control = { type = "slider", min = 1.0, max = 15.0, step = 0.5 }
default = { type = "number", value = 7.0 }

[[model.params.params]]
name = "seed"
label = "Seed"
control = { type = "seed" }

# The checkpoint comes from the server's installed list (#529): a value it doesn't have is
# refused once the list has been fetched.
[model.parameter_contract]
version = { major = 1, minor = 0 }
namespace = "comfyui.sdxl"
owner = "model"

[[model.parameter_contract.rules]]
param = "checkpoint"
options = { id = "comfyui.checkpoints" }

[[model.parameter_contract.schema.params]]
name = "checkpoint"
label = "Checkpoint"
description = "The checkpoint file on the server; Refresh option lists fetches what it has."
control = { type = "text", multiline = false, max_bytes = 512 }
default = { type = "text", value = "sd_xl_base_1.0.safetensors" }

[[model.parameter_contract.schema.params]]
name = "steps"
label = "Steps"
control = { type = "unsigned", min = "1", max = "80" }
default = { type = "unsigned", value = "30" }

[[model.parameter_contract.schema.params]]
name = "cfg"
label = "Guidance"
control = { type = "slider", min = 1.0, max = 15.0, step = 0.5 }
default = { type = "number", value = 7.0 }

[[model.parameter_contract.schema.params]]
name = "seed"
label = "Seed"
control = { type = "seed" }
