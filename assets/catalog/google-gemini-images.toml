# Gemini image models on Google Cloud Vertex AI (#47), checked 2026-10-23:
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/3-1-flash-image (and
# 3-pro-image, 3-1-flash-lite-image, nano-banana-2-1, 2-5-flash-image),
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/capabilities/image-generation
# and https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing (Vertex AI's
# pricing page under its new name, Standard PayGo, global endpoint; not the Gemini API's page).
# Signed in with a service account's key file (keychain account "google-cloud"); runs in the
# account's own project on the global endpoint, the only one the Gemini 3 image models are served on.
#
# Google bills tokens: input per million, and image output per million at a fixed number of
# tokens per image by size. The quote is one image at that size:
#   3.1 Flash Image   60 USD/M image out: 1K 1120 tokens 0.0672, 2K 1680 0.1008, 4K 2520 0.1512
#   3 Pro Image      120 USD/M:           1K and 2K 1120 tokens 0.1344, 4K 2000 0.24
#   Nano Banana 2.1   30 USD/M:           1K 1120 tokens 0.0336, 2K 1680 0.0504, 4K 3780 0.1134
#   3.1 Flash-Lite    30 USD/M:           1K 1120 tokens 0.0336 (1K only)
#   2.5 Flash Image   30 USD/M:           1290 tokens 0.0387 (one size)
# A finished run is charged what the reply measured at `usage` (per 1000 tokens): the prompt,
# reference images included (1120 tokens each, 560 on Pro), at the input rate, and every reply
# token at the image rate. That covers references and a reply with several images; the reply's
# few text tokens are charged at the image rate (a little over), and thinking tokens, billed at
# the text rate, aren't charged (a little under). 3.1 Flash's 512 size isn't offered: Vertex AI's
# imageConfig documents 1K, 2K and 4K only.

[[model]]
id = "google-gemini-images.3.1-flash"
provider = "google-gemini-images"
provider_model = "gemini-3.1-flash-image"
label = "Gemini 3.1 Flash Image (Vertex AI)"
description = "Fast image generation and reference-guided editing with Nano Banana 2 on Google Cloud. Per-image estimate."
latency_s = 60
quality = 4
pricing = { type = "per_unit_by_choice", unit = "image", default_count = 1, param = "image_size", prices = { "1K" = "0.0672 USD", "2K" = "0.1008 USD", "4K" = "0.1512 USD" } }
usage = { input = "0.0005 USD", output = "0.06 USD" }
[[model.modes]]
id = "text-to-image"
output = "image"
inputs = [{ role = "prompt", modality = "text", min = 1, max = 1, inline = true }]
[[model.modes]]
id = "edit"
output = "image"
inputs = [{ role = "prompt", modality = "text", min = 1, max = 1, inline = true }, { role = "image", modality = "image", min = 1, max = 14 }]
[[model.params.params]]
name = "image_size"
label = "Image size"
control = { type = "choice", options = [{ value = "1K", label = "1K" }, { value = "2K", label = "2K" }, { value = "4K", label = "4K" }] }
default = { type = "text", value = "1K" }
[[model.params.params]]
name = "aspect_ratio"
label = "Aspect ratio"
control = { type = "choice", options = [{ value = "1:1", label = "1:1" }, { value = "3:2", label = "3:2" }, { value = "2:3", label = "2:3" }, { value = "3:4", label = "3:4" }, { value = "4:3", label = "4:3" }, { value = "4:5", label = "4:5" }, { value = "5:4", label = "5:4" }, { value = "9:16", label = "9:16" }, { value = "16:9", label = "16:9" }, { value = "21:9", label = "21:9" }, { value = "1:4", label = "1:4" }, { value = "4:1", label = "4:1" }, { value = "1:8", label = "1:8" }, { value = "8:1", label = "8:1" }] }
default = { type = "text", value = "1:1" }

