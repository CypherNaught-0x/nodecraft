# Gemini Omni Flash video, checked 2026-10-22: https://ai.google.dev/gemini-api/docs/omni and
# https://ai.google.dev/gemini-api/docs/pricing. Veo on the Gemini API shut down on 2026-10-22
# (https://ai.google.dev/gemini-api/docs/deprecations); Veo on Google Cloud is #742.
# The clip's length is the model's choice (no duration parameter), so there is no price before the
# run. Measured tokens are charged at the video output rate (17.50 USD per million; 5,792 tokens
# per second of 720p, about 0.10 USD a second) and the input rate (1.50 USD per million).

[[model]]
id = "gemini-video.omni-flash"
provider = "gemini-video"
provider_model = "gemini-omni-1.1-flash"
label = "Gemini Omni Flash"
description = "Generate a video with sound from a prompt, a first frame (and optionally a last one) or up to three subject references. Paid Gemini tier only; about 0.10 USD a second at 720p, charged by measured tokens after the run."
latency_s = 120
quality = 4
pricing = { type = "by_usage", currency = "USD" }
usage = { input = "0.0015 USD", output = "0.0175 USD" }
[[model.modes]]
id = "text-to-video"
output = "video"
inputs = [{ role = "prompt", modality = "text", min = 1, max = 1, inline = true }]
[[model.modes]]
id = "image-to-video"
output = "video"
inputs = [{ role = "prompt", modality = "text", min = 1, max = 1, inline = true }, { role = "first_frame", modality = "image", min = 1, max = 1 }, { role = "last_frame", modality = "image", min = 0, max = 1 }]
[[model.modes]]
id = "reference-to-video"
output = "video"
inputs = [{ role = "prompt", modality = "text", min = 1, max = 1, inline = true }, { role = "reference", modality = "image", min = 1, max = 3 }]
[[model.params.params]]
name = "aspect_ratio"
label = "Aspect ratio"
control = { type = "choice", options = [{ value = "16:9", label = "16:9" }, { value = "9:16", label = "9:16" }] }
default = { type = "text", value = "16:9" }
[[model.params.params]]
name = "resolution"
label = "Resolution"
control = { type = "choice", options = [{ value = "360p", label = "360p" }, { value = "720p", label = "720p" }, { value = "1080p", label = "1080p (upscaled)" }] }
default = { type = "text", value = "720p" }
