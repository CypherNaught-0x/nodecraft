[package]
name = "nodecraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "NodeCraft: the egui shell: canvas widget, node cards, panels and theme tokens"

[lints]
workspace = true

[dependencies]
nodecraft-engine = { workspace = true }
nodecraft-catalog.workspace = true
nodecraft-graph.workspace = true
nodecraft-types.workspace = true
nodecraft-nodes.workspace = true
nodecraft-format.workspace = true
nodecraft-media.workspace = true
nodecraft-plugin-store.workspace = true
serde.workspace = true
serde_json.workspace = true
egui = { workspace = true, features = ["default_fonts"] }
eframe = { workspace = true, features = ["wgpu", "accesskit"] }
craft-ui = { workspace = true }
craft-quit = { workspace = true }
log = { workspace = true }
getrandom.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native async sheets/portals stay at the UI layer and on its main thread (#407).
rfd = "=0.17.2"
# Only for the O_NONBLOCK open flag, so a dropped FIFO can't block the drop worker (#335).
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
# Generate-from-card tests run a quoted run against the mock provider (#83); never a real one.
nodecraft-testkit = { workspace = true }
nodecraft-provider-testkit = { workspace = true }
nodecraft-exec = { workspace = true }
nodecraft-catalog.workspace = true
nodecraft-format.workspace = true
nodecraft-media = { workspace = true }
egui_kittest = { workspace = true, features = ["wgpu"] }
