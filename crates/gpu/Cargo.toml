[package]
name = "nodecraft-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "NodeCraft: wgpu actions, custom WGSL actions and the 3D preview renderer"

[lints]
workspace = true

[dependencies]
nodecraft-actions = { workspace = true }
# Validates custom shaders (#90) before any GPU sees them; the same version wgpu builds on.
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "metal", "vulkan", "dx12", "webgpu"] }

futures = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures = { workspace = true, features = ["executor"] }
serde_json = { workspace = true }
