[package]
name = "nodecraft-media"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "NodeCraft: media sniffing, decode/encode, thumbnails and metadata (standalone)"

[lints]
workspace = true

[features]
default = []
video = []
# PDF pages and text (#113), through craft-pdf.
pdf = ["dep:craft-pdf", "dep:kurbo"]
# Small PDFs built in code, for other crates' tests.
fixtures = ["pdf"]

[dependencies]
# glTF JSON (#111), and the video service's ffprobe output.
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
craft-pdf = { workspace = true, optional = true }
# Geometry types in the PDF reader's device interface (the version hayro-interpret uses).
kurbo = { version = "0.13", optional = true }
