[package]
name = "nodecraft-media"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "NodeCraft: media sniffing, decode/encode, thumbnails and metadata (standalone)"

[lints]
workspace = true

[features]
default = []
video = []

[dependencies]
# glTF JSON (#111), and the video service's ffprobe output.
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
