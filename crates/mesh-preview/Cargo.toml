[package]
name = "nodecraft-mesh-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Bounded prepared mesh bytes and the trusted browser preview worker"

[lints]
workspace = true

[features]
conformance = []

[dependencies]
nodecraft-media.workspace = true
blake3.workspace = true

[build-dependencies]
blake3.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["Document", "DedicatedWorkerGlobalScope", "Event", "EventTarget", "Location", "MessageEvent", "Performance", "Url", "Window", "Worker", "WorkerOptions", "WorkerType"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
