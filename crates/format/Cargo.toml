[package]
name = "nodecraft-format"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "NodeCraft: project files, content-addressed asset store and migrations"

[lints]
workspace = true

[features]
# Deterministic admission-cost evidence for downstream engine tests; off in product builds.
validation-metrics = []

[dependencies]
nodecraft-graph = { workspace = true }
nodecraft-types.workspace = true
nodecraft-media.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
# Direct bounded streaming ZIP integrity; reuse the already locked permissive implementation.
crc32fast = "=1.5.2"
zip.workspace = true
chacha20poly1305.workspace = true
argon2.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-atomic.workspace = true
craft-settings.workspace = true
# Safe native File-handle mismatch diagnostic (MIT choice); never ownership authority.
same-file = "=1.0.6"

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
