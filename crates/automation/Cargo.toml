[package]
autotests = false
name = "nodecraft-automation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "NodeCraft: control channel, MCP server and HTTP serve mode"

[lints]
workspace = true

[dependencies]
nodecraft-engine = { workspace = true }
nodecraft-format = { workspace = true }
nodecraft-graph = { workspace = true }
nodecraft-nodes = { workspace = true }
nodecraft-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The control channel (native only): a TCP listener, a random token and PNG screenshots.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nodecraft-media = { workspace = true }
# Pinned exactly: the OS random source for the control token.
getrandom = "=0.3.4"

[dev-dependencies]
nodecraft-media = { workspace = true, features = ["fixtures"] }
tempfile = { workspace = true }

# Integration tests: one binary, tests/it.rs, plus the ones that must run as their own binary.
[[test]]
name = "it"
path = "tests/it.rs"
