[package]
name = "nodecraft-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "NodeCraft: the Provider trait and adapters to model services"

[lints]
workspace = true

[features]
default = ["http"]
# The reqwest transport (desktop and browser). Off for crates that only need the traits.
http = ["dep:reqwest"]

[dependencies]
nodecraft-catalog = { workspace = true }
nodecraft-comfy = { workspace = true }
nodecraft-media = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
