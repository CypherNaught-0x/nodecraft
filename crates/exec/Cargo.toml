[package]
name = "nodecraft-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "NodeCraft: run planner, scheduler, queue, cancellation and cost quotes"

[lints]
workspace = true

[dependencies]
nodecraft-types = { workspace = true }
nodecraft-graph = { workspace = true }
nodecraft-nodes = { workspace = true }
nodecraft-catalog = { workspace = true }
nodecraft-actions = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
nodecraft-provider-testkit = { workspace = true }
futures = { workspace = true, features = ["executor", "thread-pool"] }
proptest.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Exact pin: safe allocator instrumentation for allocation-free finalization regressions.
allocation-counter = "=0.8.1"
