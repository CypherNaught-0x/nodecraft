[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/CypherNaught-0x/nodecraft"

[workspace.dependencies]
# internal (layers: docs/architecture.md, enforced by `cargo xtask layers`)
nodecraft-types = { path = "crates/types" }
nodecraft-media = { path = "crates/media" }
nodecraft-comfy = { path = "crates/comfy" }
nodecraft-graph = { path = "crates/graph" }
nodecraft-nodes = { path = "crates/nodes" }
nodecraft-catalog = { path = "crates/catalog" }
nodecraft-actions = { path = "crates/actions" }
nodecraft-exec = { path = "crates/exec" }
nodecraft-providers = { path = "crates/providers" }
nodecraft-gpu = { path = "crates/gpu" }
nodecraft-format = { path = "crates/format" }
nodecraft-engine = { path = "crates/engine" }
nodecraft-agent = { path = "crates/agent" }
nodecraft-automation = { path = "crates/automation" }
nodecraft-ui-egui = { path = "crates/ui-egui" }
nodecraft-testkit = { path = "crates/testkit" }

# craft-libs, pinned by immutable rev (bump deliberately, one PR per bump)
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "8f5a2831614e632f91ad367f7af2a6e5b61b9529", features = ["serde"] }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "8f5a2831614e632f91ad367f7af2a6e5b61b9529" }
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "8f5a2831614e632f91ad367f7af2a6e5b61b9529" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "8f5a2831614e632f91ad367f7af2a6e5b61b9529", features = ["menu"] }
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "8f5a2831614e632f91ad367f7af2a6e5b61b9529", features = ["raster"] }

# external
blake3 = { version = "1.8", default-features = false, features = ["std"] }
egui = { version = "0.36", default-features = false }   # the version craft-ui builds against
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
image = { version = "0.25", default-features = false }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
# Catalog data files; parsing only (no writer), and no std-only extras so wasm builds.
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["http2"] }
tokio = { version = "1", default-features = false }
tempfile = "3"
uuid = { version = "1", default-features = false, features = ["serde"] }
mime = "0.3"
proptest = "1"
regex-syntax = "0.8"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode", "perf"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2           # fast media decoding in debug builds

[profile.dev]
# Keeps file:line in panic backtraces, drops variable info: much faster links. To inspect locals in
# a debugger, build with CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# The browser build (apps/nodecraft-web, later): size over speed, since the wasm is downloaded on
# every visit and hosts cap single-file sizes.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release.package."*"]
opt-level = "s"
