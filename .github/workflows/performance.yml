name: Informational M1 performance

on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: 'Optional prior successful performance run ID with matching environment/workloads'
        required: false
        type: string
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  actions: read

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0
  CARGO_TARGET_DIR: target/perf-build

jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1 # Verified by PR #478 Linux correctness CI; renew baselines when updating.
      - name: Validate optional baseline ID
        env:
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: |
          if [ -n "$BASELINE_RUN" ]; then
            case "$BASELINE_RUN" in *[!0-9]*|0) echo 'Invalid baseline run ID'; exit 3;; esac
          fi
      - name: Collect the complete release matrix
        run: cargo xtask perf collect --machine github-shared-ubuntu24 --out target/perf/current --samples 120 --warmups 3
      - name: Download explicitly selected baseline
        if: inputs.baseline_run != '' && inputs.baseline_run != null
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf152
          path: target/perf/baseline
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
      - name: Compare like-for-like quantiles (informational slowdown, strict evidence)
        if: inputs.baseline_run != '' && inputs.baseline_run != null
        shell: bash
        run: |
          set +e
          cargo xtask perf compare target/perf/baseline/report.json target/perf/current/report.json --out target/perf/comparison
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
          cat target/perf/comparison/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Explain collection and absent comparison
        if: always()
        run: |
          if [ -f target/perf/current/summary.md ]; then cat target/perf/current/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf152
          path: |
            target/perf/current/report.json
            target/perf/current/summary.md
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.baseline_run != '' && inputs.baseline_run != null
        with:
          name: perf152-comparison
          path: target/perf/comparison
          if-no-files-found: warn
