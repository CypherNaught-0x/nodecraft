# cargo-nextest (https://nexte.st). Optional locally; `cargo test` keeps working.
#
#   cargo nextest run --workspace        # all tests except doctests
#   cargo test --doc --workspace         # nextest does not run doctests
#   cargo xtask ci --quick               # the `quick` profile below, for changed packages only

# CI (`--profile ci`). Stops at the first failure so a red PR frees its runner, fails a test that
# hangs instead of letting it hold the runner, and repeats every failure at the end of the log.
[profile.ci]
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 10 }
failure-output = "immediate-final"

# `cargo xtask slow-tests` runs every test under this profile and reads the timings back from
# target/nextest/slow-tests/junit.xml to regenerate the block below.
[profile.slow-tests]
fail-fast = false

[profile.slow-tests.junit]
path = "junit.xml"

# --- slow tests: generated by `cargo xtask slow-tests`; do not edit by hand ---
# 74 test(s) took at least 5s in a full parallel run. Every profile starts them first, so
# the longest don't finish last; the `quick` profile (`cargo xtask ci --quick`) leaves them out.

[[profile.default.overrides]]
filter = '''
    (package(=nodecraft-ui-egui) & test(=search::tests::thousand_two_kib_fields_and_hostile_nested_unicode_have_bounded_throughput))
  | (package(=nodecraft-engine) & test(=jobs::tests::strict257_tests::exact_inactive_retry_at_attempt_cap_reuses_its_original_permit))
'''
priority = 100

