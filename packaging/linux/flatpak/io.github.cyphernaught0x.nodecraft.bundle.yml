# Flatpak manifest for the single-file bundle attached to every GitHub release
# (nodecraft-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (nodecraft-<version>-linux-<arch>.tar.gz,
# built on Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no
# network and no vendored crate sources during the build, a few seconds instead of 20+ minutes,
# and byte-for-byte the same binaries as the AppImage/deb/rpm. The script unpacks the tarball
# into `stage/` next to a copy of this file. The binaries need glibc >= 2.35 and load X11,
# Wayland, xkbcommon and Vulkan at runtime; the freedesktop runtime has all of them, and the
# GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# io.github.cyphernaught0x.nodecraft.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime-version and finish-args identical in both (packaging-lint checks this).
id: io.github.cyphernaught0x.nodecraft
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: nodecraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for wgpu rendering (Vulkan, or GL as a fallback).
  - --device=dri
  # Sound on cards: the runtime's ALSA plays through the PulseAudio (or PipeWire) socket.
  - --socket=pulseaudio
  # Network: model providers, ComfyUI servers (also on localhost) and LLM endpoints.
  - --share=network
  # Open/Save dialogs go through the file-chooser portal and drag-and-drop through the document
  # portal, so picked files work anywhere without broad filesystem access. The media folders are
  # granted so files passed by path (the command line, Open Recent, exports next to a project)
  # work in the usual places.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  - --filesystem=xdg-music
  - --filesystem=xdg-documents
  # API keys live in the OS keychain (Secret Service).
  - --talk-name=org.freedesktop.secrets
  # Deliberately not granted: home/host filesystem access.
modules:
  - name: nodecraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/nodecraft /app/bin/nodecraft
      - install -Dm755 bin/nodecraft-cli /app/bin/nodecraft-cli
      - install -Dm644 share/applications/io.github.cyphernaught0x.nodecraft.desktop /app/share/applications/io.github.cyphernaught0x.nodecraft.desktop
      # The .ncraft project type.
      - install -Dm644 share/mime/packages/io.github.cyphernaught0x.nodecraft.xml /app/share/mime/packages/io.github.cyphernaught0x.nodecraft.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/io.github.cyphernaught0x.nodecraft.metainfo.xml /app/share/metainfo/io.github.cyphernaught0x.nodecraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/nodecraft /app/share/doc/
    sources:
      - type: dir
        path: stage
